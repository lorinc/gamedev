<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v3 · Terrain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050508;
        color: #ccc;
        font: 11px monospace;
      }
      body {
        display: flex;
      }
      #left {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #view {
        flex: 1;
        overflow: auto;
        padding: 8px;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      #stats {
        padding: 8px;
        border-top: 1px solid #222;
        white-space: pre;
        flex-shrink: 0;
      }
      #panel {
        width: 330px;
        overflow: auto;
        padding: 8px;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      @media (max-width: 700px) {
        body {
          flex-direction: column;
        }
        #panel {
          width: 100%;
          max-height: 45%;
        }
      }
    </style>
  </head>
  <body>
    <div id="left">
      <div id="view"><canvas id="map"></canvas></div>
      <div id="stats"></div>
    </div>
    <div id="panel"></div>
    <script type="module" src="/src/tools/v3/main.ts"></script>
  </body>
</html>
