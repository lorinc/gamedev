<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>b4 · Rail Loop</title>
    <link rel="icon" href="favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050508;
        color: #ccc;
        font: 12px monospace;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: min(340px, 100%);
        max-height: 100%;
        overflow: hidden auto;
        box-sizing: border-box;
        padding: 8px;
        background: rgba(5, 5, 8, 0.88);
        display: none;
        user-select: text;
        -webkit-user-select: text;
      }
      #panel.open {
        display: block;
      }
      #panel pre {
        margin: 0 0 8px;
        white-space: pre-wrap;
        color: #e6dc5a;
      }
      #panel fieldset {
        border: 1px solid #333;
        margin: 6px 0;
        padding: 4px 6px;
      }
      #panel label {
        display: grid;
        grid-template-columns: 110px 1fr 40px;
        align-items: center;
        gap: 6px;
        min-height: 26px;
      }
      #panel label:has(input[type='checkbox']) {
        grid-template-columns: 110px auto;
        justify-content: start;
      }
      #panel input[type='range'] {
        min-width: 0;
        width: 100%;
      }
      #panel output {
        text-align: right;
      }
      #panel .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        background: #222;
        color: #ccc;
        border: 1px solid #444;
      }
    </style>
    <script src="src/errors.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="panel"></div>
    <script type="module" src="src/bundles/b4/main.js"></script>
  </body>
</html>
