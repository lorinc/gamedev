<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v1 · Cave Generator</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050508;
        color: #ccc;
        font: 12px system-ui, sans-serif;
      }
      body {
        display: flex;
      }
      #view {
        flex: 1;
        overflow: auto;
      }
      #view canvas {
        display: block;
      }
      #panel {
        width: 320px;
        overflow: auto;
        padding: 8px;
        box-sizing: border-box;
      }
      @media (max-width: 700px) {
        body {
          flex-direction: column;
        }
        #panel {
          width: 100%;
          max-height: 45%;
        }
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel"></div>
    <script type="module" src="/src/tools/v1/main.ts"></script>
  </body>
</html>
